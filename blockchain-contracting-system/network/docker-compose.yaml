    volumes:
      - /var/run/:/host/var/run/
      - ./crypto-config/peerOrganizations/employer.example.com/peers/peer0.employer.example.com/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/employer.example.com/peers/peer0.employer.example.com/tls:/etc/hyperledger/fabric/tls
      - ./crypto-config/peerOrganizations/employer.example.com/users/Admin@employer.example.com/msp:/etc/hyperledger/fabric/admin-msp
      - ./crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/msp/tlscacerts:/etc/hyperledger/fabric/orderer-ca
